name: Prepare SDK tools
description: Install pinned development tools explicitly before offline checks
inputs:
  area:
    description: contracts, documentation, typescript, python, go, or rust
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.2
    - shell: bash
      run: echo "SDK_NODE22=$(command -v node)" >> "$GITHUB_ENV"
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
    - shell: bash
      run: |
        echo "SDK_NODE24=$(command -v node)" >> "$GITHUB_ENV"
        npm install --global corepack@0.36.0
        corepack enable
        corepack pnpm install --frozen-lockfile
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      if: inputs.area == 'contracts' || inputs.area == 'python'
      with:
        version: 0.12.1
        enable-cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      if: inputs.area == 'python'
      with:
        python-version: 3.14.6
    - if: inputs.area == 'python'
      shell: bash
      run: |
        echo "SDK_PYTHON314=$(command -v python)" >> "$GITHUB_ENV"
        uv sync --project python --locked --python 3.14.6
      env:
        UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.cache/python314
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      if: inputs.area == 'contracts' || inputs.area == 'python'
      with:
        python-version: 3.12.9
    - if: inputs.area == 'python'
      shell: bash
      run: |
        echo "SDK_PYTHON312=$(command -v python)" >> "$GITHUB_ENV"
        uv sync --project python --locked --python 3.12.9
    - if: inputs.area == 'contracts'
      shell: bash
      run: |
        uv venv .cache/generation/venv --python 3.12.9
        uv pip install --python .cache/generation/venv/bin/python -r generation/probes/python-requirements.txt
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.area == 'go' || inputs.area == 'documentation'
      with:
        go-version: 1.27.1
        cache: false
    - if: inputs.area == 'go'
      shell: bash
      run: |
        echo "SDK_GO127=$(command -v go)" >> "$GITHUB_ENV"
        GOBIN="$GITHUB_WORKSPACE/.cache/go-tools" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
    - if: inputs.area == 'documentation'
      shell: bash
      run: GOBIN="$GITHUB_WORKSPACE/.cache/go-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.area == 'contracts' || inputs.area == 'go'
      with:
        go-version: 1.26.0
        cache: false
    - if: inputs.area == 'contracts' || inputs.area == 'go'
      shell: bash
      run: |
        echo "SDK_GO126=$(command -v go)" >> "$GITHUB_ENV"
        echo "SDK_PROBE_GO=$(command -v go)" >> "$GITHUB_ENV"
        echo "SDK_GOFMT=$(go env GOROOT)/bin/gofmt" >> "$GITHUB_ENV"
    - if: inputs.area == 'contracts' || inputs.area == 'rust'
      shell: bash
      run: |
        rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
        rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
        echo "SDK_RUSTFMT=$(rustup which --toolchain 1.99.0 rustfmt)" >> "$GITHUB_ENV"
    - if: inputs.area == 'rust'
      shell: bash
      run: cargo +1.99.0 fetch --manifest-path rust/Cargo.toml --locked
    - if: inputs.area == 'contracts'
      shell: bash
      run: cargo +1.99.0 fetch --manifest-path generation/probes/rust/Cargo.toml --locked
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      if: inputs.area == 'contracts'
      with:
        distribution: corretto
        java-version: 11.0.24
    - if: inputs.area == 'contracts'
      shell: bash
      run: corepack pnpm generation:setup
