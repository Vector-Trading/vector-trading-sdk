name: SDK CI

on:
  pull_request:
  push:
    branches:
      - main
      - VT-000/sdk-implementation
  workflow_dispatch:
    inputs:
      failure-probe:
        description: Deliberately fail Rust to verify the aggregate check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/rust-target
  GOTOOLCHAIN: local

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: contracts
      - run: corepack pnpm check:area contracts
  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: typescript
      - run: corepack pnpm check:area typescript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-typescript-${{ github.run_id }}
          path: |
            .cache/packages/*.tgz
          if-no-files-found: error
          retention-days: 3
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: python
      - run: corepack pnpm check:area python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-python-${{ github.run_id }}
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: go
      - run: corepack pnpm check:area go
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-go-${{ github.run_id }}
          path: |
            go/dist/*.zip
          if-no-files-found: error
          retention-days: 3
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: rust
      - name: Controlled failure probe
        if: github.event_name == 'workflow_dispatch' && inputs.failure-probe
        run: exit 1
      - run: corepack pnpm check:area rust
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-rust-${{ github.run_id }}
          path: |
            rust/dist/*.crate
          if-no-files-found: error
          retention-days: 3
  documentation:
    name: documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
        with:
          area: documentation
      - run: corepack pnpm check:area documentation
  sdk-ci:
    name: sdk-ci
    if: always()
    needs: [contracts, typescript, python, go, rust, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: node scripts/check-ci-result.ts
        env:
          SDK_CI_NEEDS: ${{ toJSON(needs) }}
