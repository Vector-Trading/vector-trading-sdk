[package]
name = "vector_generated"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_with = { version = "=3.24.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "=1.0.151"
url = "=2.5.8"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "multipart", "query", "form"] }
tokio = { version = "=1.53.2", features = ["macros", "rt"] }
