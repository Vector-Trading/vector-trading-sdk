[package]
name = "vector-trading-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Typed Vector Trading REST clients and strategy signal builders"
repository = "https://github.com/Vector-Trading/vector-trading-sdk"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**/*.rs", "generated/src/models/**/*.rs", "generated/contract.json", "examples/**/*.rs"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", default-features = false, features = ["parsing", "std"] }
serde_with = { version = "3.24.0", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = { version = "=0.14.5", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }
